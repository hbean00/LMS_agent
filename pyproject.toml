[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lms-agent"
version = "0.6.2"
description = "Canvas LMS에서 마감이 안 보이는 과제(이메일 제출 등)까지 찾아 캘린더(.ics)로 모아 주는 도구"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lms-agent = "lms_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lms_agent = ["web/*.html", "web/characters/ku/*.gif", "web/characters/ku/NOTICE.md", "data/cacert.pem", "data/NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
