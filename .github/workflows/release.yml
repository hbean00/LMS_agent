# 테스트(모든 push) + 태그 v* 를 올리면 wheel과 OS별 실행 파일을 GitHub Release에 올린다.
name: test-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          # 지원하는 최저 버전. ubuntu-latest(26.04)에는 3.9 빌드가 없어 24.04에서 돌린다.
          - os: ubuntu-24.04
            python: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: lms-agent.exe
            asset: lms-agent-windows.exe
          - os: macos-latest
            exe: lms-agent
            asset: lms-agent-macos
          - os: ubuntu-latest
            exe: lms-agent
            asset: lms-agent-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python scripts/build_exe.py
      - run: python -c "import shutil; shutil.move('dist/${{ matrix.exe }}', 'dist/${{ matrix.asset }}')"
      - if: matrix.os == 'ubuntu-latest'
        run: python -m pip wheel . --no-deps -w dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
